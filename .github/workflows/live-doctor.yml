name: Verify live Conloca registration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx @conloca/cli doctor --live
